name: Render Remotion Video

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render MP4 Video
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Chromium Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 || sudo apt-get install -y libasound2

      - name: Install NPM Packages
        run: npm install

      - name: Render Video to MP4
        run: npx remotion render src/index.ts MainVideo out/video.mp4

      - name: Publish MP4 to GitHub Mobile Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-video
          name: "Latest Rendered Video"
          files: out/video.mp4
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 